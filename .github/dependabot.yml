version: 2
updates:
  # GitHub Actions only. Python dependencies stay manual: an awpy bump needs G-demos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - "semver:none"
    # PR titles start with NONE: (docs/delivery/versioning.md). Dependabot adds the colon.
    commit-message:
      prefix: "NONE"
